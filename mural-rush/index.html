<!doctype html>
<!-- PROTOTYPE - NOT FOR PRODUCTION. Mural Rush playable ad / concept test. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mural Rush — Paint Bots</title>
<meta name="description" content="Mural Rush playable demo: send little paint bots around the belt to restore pixel murals.">
<style>
html,body{margin:0;height:100%;background:#17122b;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ---------- setup ----------
const Q = new URLSearchParams(location.search);
const AD = Q.has('ad');          // scripted 23s ad
const REC = Q.has('rec');        // frame-stepped by the recorder (no rAF)
const VW = 720, VH = 1280;
const STORE_URL = 'https://ketchsoft.github.io/orbit-lock/mural-rush/'; // placeholder until store listing exists
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let S = 1;
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  S = Math.min(innerWidth / VW, innerHeight / VH);
  cv.style.width = Math.round(VW * S) + 'px'; cv.style.height = Math.round(VH * S) + 'px';
  cv.width = Math.round(VW * S * dpr); cv.height = Math.round(VH * S * dpr);
  ctx.setTransform(S * dpr, 0, 0, S * dpr, 0, 0);
}
addEventListener('resize', resize); resize();

let seed = 20261105;
const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const back = t => { t = clamp(t, 0, 1); const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

const PAL = { r:'#ef4444', g:'#22c55e', y:'#facc15', o:'#fb923c', w:'#eef2f7', k:'#475569', p:'#f472b6', b:'#3b82f6', v:'#a855f7' };
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = x => Math.round(f < 0 ? x * (1 + f) : x + (255 - x) * f);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}

// Original pixel murals. '.' = empty canvas.
const LEVELS = [
  { name: 'Strawberry', art: [
    '...ggg...',
    '..ggggg..',
    '.rrrgrrr.',
    'rryrrryrr',
    'rrrrrrrrr',
    'ryrrryrrr',
    '.rrrrryr.',
    '..ryrrr..',
    '...rrr...' ] },
  { name: 'Ginger Cat', art: [
    '.o........o.',
    '.oo......oo.',
    '.ooo....ooo.',
    '.oooooooooo.',
    'oooooooooooo',
    'ookkoooookko',
    'ookkoooookko',
    'oooooppooooo',
    'owwwwwwwwwwo',
    'owwwkwwkwwwo',
    '.owwwkkwwwo.',
    '..oooooooo..' ] },
  { name: 'Moon Rocket', art: [
    '.....rr.....',
    '....rrrr....',
    '....wwww....',
    '...wwwwww...',
    '...wwbbww...',
    '...wbbbbw...',
    '...wwbbww...',
    '...wwwwww...',
    '..rwwwwwwr..',
    '.rrwwwwwwrr.',
    '.rr.yyyy.rr.',
    '.....yy.....' ] },
];

// ---------- audio (live play only) ----------
let AC = null;
function beep(freq, dur, type = 'sine', vol = 0.08) {
  if (!AC || REC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 1.5, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
const EVENTS = []; window.__ev = EVENTS;
let T = 0; // global clock
function sfx(type, n = 0) {
  EVENTS.push({ t: +T.toFixed(3), type, n });
  if (type === 'pop') beep(520 + (n % 8) * 60, 0.09, 'triangle', 0.06);
  else if (type === 'launch') beep(260, 0.14, 'square', 0.035);
  else if (type === 'win') [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.25, 'triangle', 0.08), i * 110));
  else if (type === 'fail') beep(160, 0.4, 'sawtooth', 0.05);
  else if (type === 'tap') beep(880, 0.05, 'sine', 0.04);
}

// ---------- level ----------
const SLOTS = 5, BELT = 5;
const COLX = [180, 360, 540], COLY = [1012, 1108, 1186], COLSZ = [96, 74, 62];
const DOCKY = 872, DOCKX = i => 120 + i * 120;
let SPEED = AD ? 10.5 : 12; // cells per second
let G = null, lvl = 0, scene = 'play', sceneT = 0;
let toast = null;

function loadLevel(i) {
  lvl = i; scene = 'play'; sceneT = 0;
  const art = LEVELS[i].art, H = art.length, W = art[0].length;
  const grid = [], targets = [];
  for (let r = 0; r < H; r++) { grid.push([]); for (let c = 0; c < W; c++) {
    const ch = art[r][c];
    if (ch === '.') grid[r].push(null);
    else { const k = { r, c, color: ch, done: false, paintT: -1, layer: -1 }; grid[r].push(k); targets.push(k); }
  } }
  // peel layers: which cells become reachable first
  let left = targets.length, layer = 0;
  const firstFrom = (side, idx, ok) => {
    if (side === 'L') { for (let c = 0; c < W; c++) { const k = grid[idx][c]; if (k && ok(k)) return k; } }
    if (side === 'R') { for (let c = W - 1; c >= 0; c--) { const k = grid[idx][c]; if (k && ok(k)) return k; } }
    if (side === 'T') { for (let r = 0; r < H; r++) { const k = grid[r][idx]; if (k && ok(k)) return k; } }
    if (side === 'B') { for (let r = H - 1; r >= 0; r--) { const k = grid[r][idx]; if (k && ok(k)) return k; } }
    return null;
  };
  while (left > 0) {
    const vis = new Set(), ok = k => k.layer < 0;
    for (let r = 0; r < H; r++) { vis.add(firstFrom('L', r, ok)); vis.add(firstFrom('R', r, ok)); }
    for (let c = 0; c < W; c++) { vis.add(firstFrom('T', c, ok)); vis.add(firstFrom('B', c, ok)); }
    vis.delete(null); for (const k of vis) { k.layer = layer; left--; } layer++;
  }
  // bots: split each color into ammo chunks, order by how deep their cells are
  const byColor = {};
  for (const k of targets) (byColor[k.color] ||= []).push(k);
  const chunks = [];
  for (const col in byColor) {
    const ks = byColor[col].sort((a, b) => a.layer - b.layer), n = ks.length;
    const parts = Math.max(1, Math.round(n / 10)), base = Math.floor(n / parts); let extra = n - base * parts, at = 0;
    for (let p = 0; p < parts; p++) { const sz = base + (extra-- > 0 ? 1 : 0); chunks.push({ color: col, ammo: sz, pri: ks[at].layer + rnd() * 1.2 }); at += sz; }
  }
  chunks.sort((a, b) => a.pri - b.pri);
  const cols = [[], [], []];
  chunks.forEach((ch, j) => cols[j % 3].push({ id: j, color: ch.color, ammo: ch.ammo, where: 'col', x: COLX[j % 3], y: 1400, s: 0, fly: null, shake: 0 }));
  const cs = Math.floor(Math.min(560 / (W + 3.6), 560 / (H + 3.6)));
  const bx = VW / 2 - (W * cs) / 2, by = 505 - (H * cs) / 2;
  // perimeter events (track centerline 0.9 cell outside the board)
  const P = 2 * (W + H) + 7.2, evs = [];
  const s0 = H + 1.8, s1 = s0 + W + 1.8, s2 = s1 + H + 1.8;
  for (let r = 0; r < H; r++) evs.push({ s: (H + 0.9) - (r + 0.5), side: 'L', idx: r });
  for (let c = 0; c < W; c++) evs.push({ s: s0 + c + 0.5 + 0.9, side: 'T', idx: c });
  for (let r = 0; r < H; r++) evs.push({ s: s1 + r + 0.5 + 0.9, side: 'R', idx: r });
  for (let c = 0; c < W; c++) evs.push({ s: s2 + (W + 0.9) - (c + 0.5), side: 'B', idx: c });
  evs.sort((a, b) => a.s - b.s);
  G = { W, H, grid, targets, cols, dock: Array(SLOTS).fill(null), track: [], pending: [], shots: [], parts: [],
        total: targets.length, painted: 0, state: 'play', st: 0, cs, bx, by, P, evs, firstFrom, segs: [s0, s1, s2], tapped: false };
}

function trackPos(s) {
  const { W, H, cs, bx, by, segs: [s0, s1, s2] } = G; let x, y, side;
  if (s < s0) { x = -0.9; y = (H + 0.9) - s; side = 'L'; }
  else if (s < s1) { x = -0.9 + (s - s0); y = -0.9; side = 'T'; }
  else if (s < s2) { x = W + 0.9; y = -0.9 + (s - s1); side = 'R'; }
  else { x = (W + 0.9) - (s - s2); y = H + 0.9; side = 'B'; }
  return { x: bx + x * cs, y: by + y * cs, side };
}
const cellCenter = k => ({ x: G.bx + (k.c + 0.5) * G.cs, y: G.by + (k.r + 0.5) * G.cs });

function entryFree() { return !G.track.some(b => b.s < 1.5); }
function launch(b) {
  if (G.state !== 'play') return false;
  if (G.track.length + G.pending.length >= BELT) { b.shake = 0.35; showToast('Belt is full!'); return false; }
  if (b.where === 'col') { const col = G.cols.find(c => c[0] === b); if (!col) return false; col.shift(); }
  else if (b.where === 'dock') { G.dock[G.dock.indexOf(b)] = null; }
  else return false;
  b.where = 'track'; b.fly = { x: b.x, y: b.y, t: 0 }; G.pending.push(b); G.tapped = true; sfx('launch'); return true;
}
function exposed(color) {
  const { W, H, firstFrom } = G, set = new Set(), ok = k => !k.done;
  for (let r = 0; r < H; r++) { set.add(firstFrom('L', r, ok)); set.add(firstFrom('R', r, ok)); }
  for (let c = 0; c < W; c++) { set.add(firstFrom('T', c, ok)); set.add(firstFrom('B', c, ok)); }
  let n = 0; for (const k of set) if (k && k.color === color) n++; return n;
}
function fire(b, ev) {
  const k = G.firstFrom(ev.side, ev.idx, k => !k.done);
  if (!k || k.color !== b.color || b.ammo <= 0) return;
  k.done = true; b.ammo--; b.kick = 0.12;
  const p = trackPos(b.s), c = cellCenter(k);
  G.shots.push({ x0: p.x, y0: p.y, x1: c.x, y1: c.y, t: 0, dur: 0.13, color: b.color, k });
}
function park(b) {
  const i = G.dock.indexOf(null);
  if (i < 0) { G.state = 'fail'; G.st = 0; sfx('fail'); b.where = 'gone'; return; }
  G.dock[i] = b; b.where = 'dock'; const p = trackPos(G.P - 0.01); b.x = p.x; b.y = p.y;
}
function burst(x, y, color, n, spd = 260, life = 0.5) {
  for (let i = 0; i < n; i++) { const a = rnd() * Math.PI * 2, v = spd * (0.4 + rnd() * 0.8);
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, t: 0, color, sz: 4 + rnd() * 6 }); }
}
function showToast(s) { toast = { s, t: 0 }; }

// ---------- update ----------
function update(dt) {
  T += dt; sceneT += dt; if (toast) { toast.t += dt; if (toast.t > 1.4) toast = null; }
  if (scene !== 'play') return;
  G.st += dt;
  if (G.state === 'play') {
    while (G.pending.length && entryFree()) { const b = G.pending.shift(); b.s = 0; G.track.push(b); }
    for (const b of G.track) {
      const s0 = b.s; b.s += SPEED * dt;
      for (const ev of G.evs) if (ev.s > s0 && ev.s <= b.s) fire(b, ev);
    }
    for (const b of G.track.slice()) {
      if (b.ammo <= 0) { G.track.splice(G.track.indexOf(b), 1); b.where = 'gone'; const p = trackPos(b.s); burst(p.x, p.y, PAL[b.color], 14, 220); }
      else if (b.s >= G.P) { G.track.splice(G.track.indexOf(b), 1); park(b); if (G.state === 'fail') break; }
    }
  }
  for (const sh of G.shots) sh.t += dt;
  for (const sh of G.shots.filter(s => s.t >= s.dur)) {
    sh.k.paintT = T; G.painted++; burst(sh.x1, sh.y1, PAL[sh.color], 6, 160, 0.35); sfx('pop', G.painted);
  }
  G.shots = G.shots.filter(s => s.t < s.dur);
  for (const p of G.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g ?? 500) * dt; }
  G.parts = G.parts.filter(p => p.t < p.life);
  if (G.state === 'play' && G.painted === G.total) {
    G.state = 'win'; G.st = 0; sfx('win');
    for (let i = 0; i < 140; i++) { const c = Object.values(PAL)[i % 9];
      G.parts.push({ x: rnd() * VW, y: -20 - rnd() * 300, vx: (rnd() - 0.5) * 120, vy: 200 + rnd() * 260, g: 120, life: 3.2, t: 0, color: c, sz: 8 + rnd() * 8, conf: true, rot: rnd() * 6 }); }
    for (const b of G.track) b.where = 'gone'; G.track = [];
  }
  // tween resting bots
  G.cols.forEach((col, ci) => col.forEach((b, j) => { const ty = j < 3 ? COLY[j] : 1320; b.x += (COLX[ci] - b.x) * Math.min(1, dt * 14); b.y += (ty - b.y) * Math.min(1, dt * 14); }));
  G.dock.forEach((b, i) => { if (b) { b.x += (DOCKX(i) - b.x) * Math.min(1, dt * 12); b.y += (DOCKY - b.y) * Math.min(1, dt * 12); } });
  for (const b of [...G.track, ...G.pending]) if (b.fly) { b.fly.t += dt; if (b.fly.t > 0.22) b.fly = null; }
  for (const b of allBots()) { if (b.shake > 0) b.shake -= dt; if (b.kick > 0) b.kick -= dt; }
}
function allBots() { return [...G.cols.flat(), ...G.dock.filter(Boolean), ...G.track, ...G.pending]; }

// ---------- render ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(s, x, y, size, color, align = 'center', weight = 800, stroke = null) {
  ctx.font = `${weight} ${size}px ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.22; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function drawBot(x, y, sz, color, ammo, alpha = 1, glow = false) {
  const c = PAL[color]; ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y);
  const w = sz, h = sz * 0.92;
  if (glow) { ctx.shadowColor = c; ctx.shadowBlur = 24; }
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(0, h * 0.52, w * 0.42, h * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  // antenna
  ctx.strokeStyle = shade(c, -0.35); ctx.lineWidth = sz * 0.05; ctx.beginPath(); ctx.moveTo(0, -h * 0.46); ctx.lineTo(0, -h * 0.62); ctx.stroke();
  ctx.fillStyle = shade(c, 0.35); ctx.beginPath(); ctx.arc(0, -h * 0.64, sz * 0.07, 0, Math.PI * 2); ctx.fill();
  // body
  ctx.fillStyle = shade(c, -0.3); rr(-w / 2, -h / 2 + h * 0.06, w, h, sz * 0.26); ctx.fill();
  ctx.fillStyle = c; rr(-w / 2, -h / 2, w, h * 0.94, sz * 0.26); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,.25)'; rr(-w * 0.38, -h * 0.44, w * 0.76, h * 0.16, sz * 0.08); ctx.fill();
  // visor + eyes
  ctx.fillStyle = '#1f1a3a'; rr(-w * 0.36, -h * 0.26, w * 0.72, h * 0.3, sz * 0.13); ctx.fill();
  ctx.fillStyle = '#fff'; const blink = (Math.sin(T * 2.3 + x * 0.05) > 0.985) ? 0.15 : 1;
  for (const ex of [-0.17, 0.17]) { ctx.beginPath(); ctx.ellipse(w * ex, -h * 0.11, sz * 0.07, sz * 0.08 * blink, 0, 0, Math.PI * 2); ctx.fill(); }
  // ammo
  text(String(ammo), 0, h * 0.24, sz * 0.3, '#fff', 'center', 900, 'rgba(0,0,0,.35)');
  ctx.restore();
}
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#2b2255'); g.addColorStop(0.55, '#1d1840'); g.addColorStop(1, '#141029');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = 'rgba(255,255,255,.03)'; for (let i = 0; i < 12; i++) { ctx.beginPath(); ctx.arc((i * 137) % VW, (i * 251) % VH, 40 + (i % 4) * 30, 0, Math.PI * 2); ctx.fill(); }
}
function drawHeader() {
  text(`MURAL ${lvl + 1}/${LEVELS.length}`, 40, 62, 22, '#a99ee8', 'left', 800);
  text(LEVELS[lvl].name, 40, 98, 36, '#fff', 'left', 900);
  const pw = 470, px = 40, py = 140, pct = G.painted / G.total;
  ctx.fillStyle = 'rgba(255,255,255,.12)'; rr(px, py - 11, pw, 22, 11); ctx.fill();
  const pg = ctx.createLinearGradient(px, 0, px + pw, 0); pg.addColorStop(0, '#f472b6'); pg.addColorStop(1, '#facc15');
  ctx.fillStyle = pg; rr(px, py - 11, Math.max(22, pw * pct), 22, 11); ctx.fill();
  text(Math.round(pct * 100) + '%', px + pw + 14, py, 22, '#fff', 'left', 900);
  // target thumbnail
  const { W, H } = G, ts = Math.floor(100 / Math.max(W, H)), tx = VW - 40 - W * ts, ty = 52;
  ctx.fillStyle = 'rgba(255,255,255,.08)'; rr(tx - 8, ty - 8, W * ts + 16, H * ts + 16, 12); ctx.fill();
  for (const k of G.targets) { ctx.fillStyle = PAL[k.color]; ctx.fillRect(tx + k.c * ts, ty + k.r * ts, ts, ts); }
}
function drawBoard() {
  const { W, H, cs, bx, by } = G;
  // belt
  const pad = cs * 0.9, bw = cs * 0.95;
  ctx.strokeStyle = '#3a3170'; ctx.lineWidth = bw; rr(bx - pad, by - pad, W * cs + pad * 2, H * cs + pad * 2, cs * 0.8); ctx.stroke();
  ctx.save(); ctx.setLineDash([cs * 0.3, cs * 0.5]); ctx.lineDashOffset = -T * SPEED * cs; ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.lineWidth = bw * 0.18;
  rr(bx - pad, by - pad, W * cs + pad * 2, H * cs + pad * 2, cs * 0.8); ctx.stroke(); ctx.restore();
  // canvas plate
  ctx.fillStyle = '#efe6d6'; rr(bx - 8, by - 8, W * cs + 16, H * cs + 16, 14); ctx.fill();
  ctx.fillStyle = '#e2d6c1'; rr(bx - 2, by - 2, W * cs + 4, H * cs + 4, 10); ctx.fill();
  const winPulse = G.state === 'win' ? Math.sin(Math.min(1, G.st * 1.6) * Math.PI) * 0.06 : 0;
  for (const k of G.targets) {
    const x = bx + k.c * cs, y = by + k.r * cs, c = PAL[k.color];
    if (k.paintT >= 0) {
      const a = back((T - k.paintT) / 0.22), s = cs * (0.5 + 0.5 * a) * (1 + winPulse), o = (cs - s) / 2;
      ctx.fillStyle = c; rr(x + o + 1, y + o + 1, s - 2, s - 2, cs * 0.18); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.22)'; rr(x + o + 3, y + o + 3, s - 6, (s - 6) * 0.35, cs * 0.12); ctx.fill();
    } else {
      ctx.fillStyle = '#cfc1a8'; rr(x + 2, y + 2, cs - 4, cs - 4, cs * 0.18); ctx.fill();
      ctx.fillStyle = c; ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.arc(x + cs / 2, y + cs / 2, cs * 0.17, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    }
  }
  // entry marker
  const e = trackPos(0.01); ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(e.x, e.y, cs * 0.55, 0, Math.PI * 2); ctx.fill();
}
function drawTrackBots() {
  const sz = Math.max(46, G.cs * 1.2);
  for (const b of [...G.track, ...G.pending]) {
    let p = b.where === 'track' && G.track.includes(b) ? trackPos(b.s) : trackPos(0.01);
    if (b.fly) { const t = ease(b.fly.t / 0.22); p = { x: b.fly.x + (p.x - b.fly.x) * t, y: b.fly.y + (p.y - b.fly.y) * t - Math.sin(t * Math.PI) * 60 }; }
    const k = b.kick > 0 ? 1 + b.kick * 1.5 : 1;
    drawBot(p.x, p.y, sz * k, b.color, b.ammo, 1, true);
  }
  for (const sh of G.shots) {
    const t = sh.t / sh.dur, x = sh.x0 + (sh.x1 - sh.x0) * t, y = sh.y0 + (sh.y1 - sh.y0) * t;
    ctx.fillStyle = PAL[sh.color]; ctx.beginPath(); ctx.arc(x, y, G.cs * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(x - 2, y - 2, G.cs * 0.08, 0, Math.PI * 2); ctx.fill();
  }
}
function drawDockAndQueue() {
  text('DOCK', 40, DOCKY - 70, 18, '#8d82c9', 'left', 800);
  const used = G.dock.filter(Boolean).length;
  text(`${used}/${SLOTS}`, VW - 40, DOCKY - 70, 18, used >= 4 ? '#f87171' : '#8d82c9', 'right', 800);
  text(`BELT ${G.track.length + G.pending.length}/${BELT}`, VW / 2, DOCKY - 70, 18, '#8d82c9', 'center', 800);
  for (let i = 0; i < SLOTS; i++) {
    ctx.fillStyle = used >= 4 && !G.dock[i] ? 'rgba(248,113,113,.14)' : 'rgba(255,255,255,.06)';
    rr(DOCKX(i) - 50, DOCKY - 50, 100, 100, 22); ctx.fill();
    ctx.setLineDash([8, 8]); ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
  }
  for (const b of G.dock) if (b) drawBot(b.x + (b.shake > 0 ? Math.sin(T * 60) * 6 : 0), b.y, 78, b.color, b.ammo);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; rr(30, 950, VW - 60, 300, 30); ctx.fill();
  G.cols.forEach(col => { for (let j = Math.min(2, col.length - 1); j >= 0; j--) { const b = col[j];
    drawBot(b.x + (b.shake > 0 ? Math.sin(T * 60) * 6 : 0), b.y, COLSZ[j], b.color, b.ammo, j === 0 ? 1 : j === 1 ? 0.75 : 0.5); }
    if (col.length > 3) text('+' + (col.length - 3), col[0].x, 1240, 18, '#8d82c9');
  });
}
function drawParts() {
  for (const p of G.parts) {
    ctx.globalAlpha = clamp(1 - p.t / p.life, 0, 1); ctx.fillStyle = p.color;
    if (p.conf) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + p.t * 6); ctx.fillRect(-p.sz / 2, -p.sz / 4, p.sz, p.sz / 2); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.sz * (1 - p.t / p.life * 0.5), 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
function button(label, x, y, w, h, t = 0) {
  const s = 1 + Math.sin(t * 6) * 0.04; ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#c2410c'; rr(-w / 2, -h / 2 + 8, w, h, h / 2); ctx.fill();
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, '#fdba74'); g.addColorStop(1, '#f97316');
  ctx.fillStyle = g; rr(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  text(label, 0, 2, h * 0.42, '#fff', 'center', 900, 'rgba(124,45,18,.5)'); ctx.restore();
}
function drawOverlays() {
  if (G.state === 'win') {
    const a = ease(G.st / 0.4);
    text('MURAL RESTORED!', VW / 2, 860, 54 * back(G.st / 0.5), '#fff', 'center', 900, '#7c3aed');
    if (!AD && G.st > 1.6) { ctx.globalAlpha = a; button(lvl < LEVELS.length - 1 ? 'NEXT MURAL ▶' : 'CONTINUE ▶', VW / 2, 1080, 380, 96, G.st); ctx.globalAlpha = 1; }
  }
  if (G.state === 'fail') {
    ctx.fillStyle = `rgba(10,8,25,${0.7 * ease(G.st / 0.3)})`; ctx.fillRect(0, 0, VW, VH);
    text('Dock is full!', VW / 2, 520, 60, '#fff', 'center', 900, '#b91c1c');
    text('Plan your bots: paint the outer layer first.', VW / 2, 600, 24, '#c9c2f0', 'center', 600);
    if (G.st > 0.6) button('TRY AGAIN', VW / 2, 760, 360, 96, G.st);
  }
  if (toast) { ctx.globalAlpha = clamp(1.4 - toast.t, 0, 1); ctx.fillStyle = 'rgba(0,0,0,.6)'; rr(VW / 2 - 160, 760, 320, 60, 30); ctx.fill(); text(toast.s, VW / 2, 791, 26, '#fff'); ctx.globalAlpha = 1; }
}
function drawEndCard(t) {
  drawBg();
  ctx.globalAlpha = ease(t / 0.4);
  // mini murals collage
  LEVELS.forEach((L, i) => { const W = L.art[0].length, H = L.art.length, ts = 14, x = 110 + i * 190 + (i === 1 ? 0 : 0), y = 250 + (i === 1 ? -40 : 0);
    ctx.save(); ctx.translate(x + W * ts / 2, y + H * ts / 2); ctx.rotate((i - 1) * 0.12 + Math.sin(T * 2 + i) * 0.03); ctx.translate(-W * ts / 2, -H * ts / 2);
    ctx.fillStyle = '#efe6d6'; rr(-10, -10, W * ts + 20, H * ts + 20, 12); ctx.fill();
    L.art.forEach((row, r) => [...row].forEach((ch, c) => { if (ch !== '.') { ctx.fillStyle = PAL[ch]; ctx.fillRect(c * ts, r * ts, ts, ts); } }));
    ctx.restore(); });
  ['r', 'b', 'y', 'g', 'p'].forEach((c, i) => drawBot(140 + i * 110, 620 + Math.sin(T * 5 + i) * 10, 90, c, [10, 8, 12, 9, 7][i]));
  text('MURAL RUSH', VW / 2, 780, 86 * back(t / 0.6), '#fff', 'center', 900, '#7c3aed');
  text('Send paint bots. Restore 1,000+ murals.', VW / 2, 860, 28, '#d8d2ff', 'center', 700);
  button('PLAY FREE', VW / 2, 1000, 420, 110, T);
  text('iOS · Android · Facebook Instant Games', VW / 2, 1110, 22, '#8d82c9', 'center', 700);
  ctx.globalAlpha = 1;
}

// ---------- tutorial / ad direction ----------
const AH = { t: 0, finger: { x: 560, y: 1300 }, plan: null, cool: 0, ripple: null };
function pickBest() {
  const fronts = [...G.cols.filter(c => c.length).map(c => c[0]), ...G.dock.filter(Boolean)];
  const onBelt = c => [...G.track, ...G.pending].filter(b => b.color === c).reduce((s, b) => s + b.ammo, 0);
  let best = null, bs = 0;
  for (const b of fronts) { const e = exposed(b.color) - onBelt(b.color); const sc = Math.min(e, b.ammo) + (b.where === 'dock' ? 0.5 : 0); if (sc > bs) { bs = sc; best = b; } }
  if (!best && !G.track.length && !G.pending.length) best = fronts[0] || null;
  return best;
}
function drawFinger(x, y, pressed) {
  ctx.save(); ctx.translate(x, y); ctx.scale(pressed ? 0.88 : 1, pressed ? 0.88 : 1);
  ctx.font = '84px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('👆', 10, -6); ctx.restore();
}
function caption(s, y, t, color = '#fff', size = 40) {
  const a = clamp(t / 0.25, 0, 1); ctx.globalAlpha = a;
  ctx.font = `900 ${size}px ui-rounded, system-ui, sans-serif`; const w = ctx.measureText(s).width + 56;
  ctx.fillStyle = 'rgba(20,14,48,.82)'; rr(VW / 2 - w / 2, y - size * 0.85, w, size * 1.7, size * 0.85); ctx.fill();
  text(s, VW / 2, y, size * (0.9 + 0.1 * back(t / 0.3)), color, 'center', 900); ctx.globalAlpha = 1;
}
function adUpdate(dt) {
  AH.t += dt;
  if (AH.t >= 20 && scene !== 'end') { scene = 'end'; sceneT = 0; }
  if (scene !== 'play') return;
  const f = AH.finger;
  if (AH.t > 1.6 && G.state === 'play') {
    AH.cool -= dt;
    if (!AH.plan && AH.cool <= 0 && G.track.length + G.pending.length < BELT) { const b = pickBest(); if (b) AH.plan = { b, t: 0, fx: f.x, fy: f.y }; }
    if (AH.plan) {
      const p = AH.plan; p.t += dt; const k = ease(p.t / 0.24);
      f.x = p.fx + (p.b.x - p.fx) * k; f.y = p.fy + (p.b.y + 20 - p.fy) * k;
      if (p.t >= 0.26) { if (launch(p.b)) { AH.ripple = { x: f.x, y: f.y - 20, t: 0 }; sfx('tap'); } AH.plan = null; AH.cool = 0.45; }
    }
  } else if (AH.t <= 1.6) { const k = ease(AH.t / 1.2); f.x = 560 + (COLX[0] - 560) * k; f.y = 1300 + (COLY[0] + 20 - 1300) * k; }
  if (AH.ripple) { AH.ripple.t += dt; if (AH.ripple.t > 0.4) AH.ripple = null; }
}
function adDraw() {
  if (scene !== 'play') return;
  const t = AH.t;
  if (AH.ripple) { const r = AH.ripple; ctx.strokeStyle = `rgba(255,255,255,${1 - r.t / 0.4})`; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(r.x, r.y, 20 + r.t * 140, 0, Math.PI * 2); ctx.stroke(); }
  if (G.state === 'play') drawFinger(AH.finger.x, AH.finger.y, AH.plan && AH.plan.t > 0.2);
  if (t < 2.6) caption('Can you restore this mural?', 200, t, '#fff', 36);
  else if (t < 6.2) caption('Tap a bot — it paints its color!', 200, t - 2.6, "#fde68a", 34);
  else if (t < 10) caption('Outer layer first 🧠', 200, t - 6.2, "#a7f3d0", 34);
  else if (G.state === 'play' && t < 15.5) caption(G.dock.filter(Boolean).length >= 2 ? 'Don’t fill the dock! 😬' : 'So satisfying… 🎨', 200, t - 10, "#fecaca", 34);
}

// ---------- input ----------
function onTap(e) {
  if (!AC && !REC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / S, y = (e.clientY - r.top) / S;
  // CTA: PLAY FREE opens the store through MRAID when the ad network provides it
  if (scene === 'end' && Math.abs(x - VW / 2) < 210 && Math.abs(y - 1000) < 55 && window.mraid && mraid.open) { mraid.open(STORE_URL); return; }
  if (AD) return;
  if (scene === 'end') { if (sceneT > 0.8) loadLevel(0); return; }
  if (G.state === 'fail') { if (G.st > 0.6) loadLevel(lvl); return; }
  if (G.state === 'win') { if (G.st > 1.6) { if (lvl < LEVELS.length - 1) loadLevel(lvl + 1); else { scene = 'end'; sceneT = 0; } } return; }
  for (const col of G.cols) { const b = col[0]; if (b && Math.abs(x - b.x) < 60 && Math.abs(y - b.y) < 60) { launch(b); return; } }
  for (const b of G.dock) if (b && Math.abs(x - b.x) < 55 && Math.abs(y - b.y) < 55) { launch(b); return; }
}
cv.addEventListener('pointerdown', onTap);

// ---------- loop ----------
function frame(dt) {
  if (AD) adUpdate(dt);
  update(dt);
  if (scene === 'end') { drawEndCard(sceneT); return; }
  drawBg(); drawHeader(); drawBoard(); drawTrackBots(); drawDockAndQueue(); drawParts(); drawOverlays();
  if (AD) adDraw();
  else if (lvl === 0 && !G.tapped && G.state === 'play') {
    const b = G.cols[0][0]; caption("Tap a bot to send it out!", 200, T, "#fff", 34);
    if (b) drawFinger(b.x + 10, b.y + 30 + Math.sin(T * 6) * 10, Math.sin(T * 6) > 0.6);
  }
}
loadLevel(AD ? 1 : 0);
window.__adStep = dt => frame(dt);
window.__state = () => ({ t: AH.t, scene, state: G.state, painted: G.painted, total: G.total, dock: G.dock.filter(Boolean).length });
if (!REC) {
  let last = performance.now();
  const loop = now => { const dt = Math.min(0.05, (now - last) / 1000); last = now; frame(dt);
    if (AD && AH.t >= 23) { AH.t = 0; T = 0; seed = 20261105; EVENTS.length = 0; AH.plan = null; AH.cool = 0; AH.finger = { x: 560, y: 1300 }; loadLevel(1); }
    requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
