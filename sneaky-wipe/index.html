/* ---------- audio (synthesized) ---------- */
let AC = null, noiseBuf = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)();
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.2, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!AC || CAP) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
}
let lastScrub = 0;
const sfx = {
  scrub() { if (!AC || CAP || S.t - lastScrub < 0.07) return; lastScrub = S.t;
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = noiseBuf;
    f.type = 'bandpass'; f.frequency.value = 2200 + Math.random() * 1200; f.Q.value = 1.2; g.gain.value = 0.08;
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(); s.stop(AC.currentTime + 0.09); },
  reveal() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone('triangle', f, f, 0.3, 0.12, i * 0.07)); },
  fail() { tone('square', 220, 110, 0.4, 0.08); },
  click() { tone('sine', 880, 660, 0.08, 0.08); },
};

/* ---------- state ---------- */
const S = { li: 0, L: null, phase: 'intro', phaseT: 0, t: 0, fuel: 1, fuelMax: 1, cov: 0, grid: null, tcells: 0, tgot: 0,
            stroke: null, hint: -9, tutorial: true, wasted: 0, fx: [] };
const G = CFG.scene.s / CFG.cell;
let layerTruth, layerCover, lc;   // offscreen canvases at 2x

function mkLayer() { const c = document.createElement('canvas'); c.width = c.height = CFG.scene.s * 2; const g = c.getContext('2d'); g.scale(2, 2); return [c, g]; }
function inTarget(x, y) {
  const T = S.L.target;
  if (T.kind === 'rect') return x >= T.x && x <= T.x + T.w && y >= T.y && y <= T.y + T.h;
  const dx = (x - T.x) / T.rx, dy = (y - T.y) / T.ry; return dx * dx + dy * dy <= 1;
}
function loadLevel(i) {
  S.li = i; S.L = LEVELS[i];
  const [tc, tg] = mkLayer(); S.L.base(tg); S.L.truth(tg); layerTruth = tc;
  const [cc, cg] = mkLayer(); S.L.base(cg); S.L.cover(cg); layerCover = cc; lc = cg;
  S.grid = new Uint8Array(G * G); S.tcells = 0; S.tgot = 0;
  for (let r = 0; r < G; r++) for (let q = 0; q < G; q++) if (inTarget((q + 0.5) * CFG.cell, (r + 0.5) * CFG.cell)) { S.grid[r * G + q] = 2; S.tcells++; }
  S.fuelMax = S.fuel = Math.round(S.tcells * S.L.fuel); S.cov = 0; S.wasted = 0;
  S.phase = 'intro'; S.phaseT = S.t; S.stroke = null; S.hint = -9; S.tutorial = i === 0; S.fx = [];
  log('level', { level: i + 1 });
}
function log(type, extra = {}) { (window.__events = window.__events || []).push({ t: +S.t.toFixed(3), type, level: S.li + 1, ...extra }); }

function wipe(x0, y0, x1, y1) {
  if (S.phase !== 'play' || S.fuel <= 0) return;
  lc.save(); lc.globalCompositeOperation = 'destination-out'; lc.lineCap = 'round'; lc.lineWidth = CFG.brush * 2;
  lc.beginPath(); lc.moveTo(x0, y0); lc.lineTo(x1 + 0.01, y1); lc.stroke(); lc.restore();
  const d = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(d / 4)), R = CFG.brush, cs = CFG.cell;
  let fresh = 0;
  for (let k = 0; k <= n; k++) {
    const px = x0 + (x1 - x0) * k / n, py = y0 + (y1 - y0) * k / n;
    for (let r = Math.max(0, Math.floor((py - R) / cs)); r <= Math.min(G - 1, Math.floor((py + R) / cs)); r++)
      for (let q = Math.max(0, Math.floor((px - R) / cs)); q <= Math.min(G - 1, Math.floor((px + R) / cs)); q++) {
        const id = r * G + q, v = S.grid[id]; if (v === 1 || v === 3) continue;
        if (Math.hypot((q + 0.5) * cs - px, (r + 0.5) * cs - py) > R) continue;
        S.grid[id] = v === 2 ? 3 : 1; fresh++; if (v === 2) S.tgot++; else S.wasted++;
      }
  }
  if (fresh) { S.fuel = Math.max(0, S.fuel - fresh); sfx.scrub(); S.tutorial = false; if (S.stroke) S.stroke.moved = true; }
  S.cov = S.tgot / S.tcells;
  if (S.cov >= CFG.winCoverage) { S.phase = 'win'; S.phaseT = S.t; sfx.reveal(); buzz([20, 40, 20]); log('win', { fuelLeft: +(S.fuel / S.fuelMax).toFixed(2) }); confetti(); }
  else if (S.fuel <= 0) { S.phase = 'fail'; S.phaseT = S.t; sfx.fail(); buzz(120); log('fail'); }
}
function buzz(ms) { if (navigator.vibrate && !CAP) try { navigator.vibrate(ms); } catch (e) {} }
function confetti() { const T = S.L.target, cxp = T.kind === 'rect' ? T.x + T.w / 2 : T.x, cyp = T.kind === 'rect' ? T.y + T.h / 2 : T.y;
  const cols = ['#ffd60a', '#fb8500', '#ef476f', '#06d6a0', '#118ab2'];
  for (let i = 0; i < 40; i++) { const a = Math.random() * Math.PI * 2, v = 180 + Math.random() * 320;
    S.fx.push({ x: CFG.scene.x + cxp, y: CFG.scene.y + cyp, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 200, t: S.t, life: 1 + Math.random() * 0.5, c: cols[i % 5], r: Math.random() * 6 }); } }

/* ---------- screen helpers ---------- */
const ease = { out: x => 1 - Math.pow(1 - x, 3), back: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); } };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function rr(x, y, w, h, r) { cx.beginPath(); cx.roundRect ? cx.roundRect(x, y, w, h, r) : cx.rect(x, y, w, h); }
const FONT = '"Avenir Next", "Nunito", "Trebuchet MS", system-ui, sans-serif';
function text(str, x, y, size, color, weight = 900, align = 'center') {
  cx.font = `${weight} ${size}px ${FONT}`; cx.textAlign = align; cx.textBaseline = 'middle'; cx.fillStyle = color; cx.fillText(str, x, y); }
function fitText(str, x, y, size, maxW, color, weight = 900) { cx.font = `${weight} ${size}px ${FONT}`; const w = cx.measureText(str).width; text(str, x, y, w > maxW ? size * maxW / w : size, color, weight); }
function button(label, x, y, w, h, bg, fg, t, shadow = '#00000040') {
  const p = 1 + Math.sin(t * 5) * 0.03; cx.save(); cx.translate(x, y); cx.scale(p, p);
  cx.fillStyle = shadow; rr(-w / 2, -h / 2 + 7, w, h, h / 2); cx.fill(); cx.fillStyle = bg; rr(-w / 2, -h / 2, w, h, h / 2); cx.fill();
  text(label, 0, 2, h * 0.42, fg); cx.restore(); }
function hand(x, y, press) {
  cx.save(); cx.translate(x, y); cx.rotate(-0.35); const s = press ? 0.9 : 1; cx.scale(s, s);
  cx.fillStyle = '#fff'; cx.strokeStyle = '#2b2d42'; cx.lineWidth = 4;
  rr(-11, -6, 22, 40, 11); cx.fill(); cx.stroke(); rr(-26, 22, 52, 46, 18); cx.fill(); cx.stroke(); cx.restore(); }
function eraserIcon(x, y, s) { cx.save(); cx.translate(x, y); cx.rotate(-0.5); cx.scale(s, s);
  cx.fillStyle = '#ff8fab'; rr(-18, -10, 24, 20, 4); cx.fill(); cx.fillStyle = '#8ecae6'; rr(4, -10, 16, 20, 4); cx.fill();
  cx.strokeStyle = '#2b2d42'; cx.lineWidth = 3; rr(-18, -10, 38, 20, 5); cx.stroke(); cx.restore(); }

/* ---------- render ---------- */
const UI = { hint: { x: 446, y: 790, w: 128, h: 58 }, cta: { w: 330, h: 92 }, retry: { w: 260, h: 70 } };

function render() {
  const t = S.t, sc = CFG.scene;
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.fillStyle = '#2b2d42'; cx.fillRect(0, 0, cv.width, cv.height);
  cx.setTransform(scale, 0, 0, scale, offX, offY);
  const g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5f4bb6'); g.addColorStop(1, '#2b2d72');
  cx.fillStyle = g; cx.fillRect(-300, -300, W + 600, H + 600);
  cx.fillStyle = 'rgba(255,255,255,0.06)';
  for (let i = 0; i < 12; i++) { const px = (i * 151 + t * 10) % (W + 80) - 40, py = (i * 263) % H; cx.beginPath(); cx.arc(px, py, 10 + (i % 4) * 9, 0, Math.PI * 2); cx.fill(); }

  // header
  if (!DEMO || !demo.cap) { text('SNEAKY WIPE', W / 2, 66, 46, '#ffd60a'); text('Tricky Reveal', W / 2, 104, 22, '#cdb8ff', 800); }
  cx.fillStyle = '#ffffff22'; rr(28, 134, 140, 48, 24); cx.fill(); text(`LEVEL ${S.li + 1}`, 98, 159, 23, '#fff');
  // eraser meter
  const fk = S.fuel / S.fuelMax, low = fk < 0.3 && S.phase === 'play';
  cx.fillStyle = '#ffffff22'; rr(250, 134, 262, 48, 24); cx.fill(); eraserIcon(282, 158, 1);
  cx.fillStyle = '#00000055'; rr(312, 148, 184, 20, 10); cx.fill();
  cx.fillStyle = low ? (Math.sin(t * 18) > 0 ? '#ef476f' : '#ff8fa3') : '#06d6a0'; rr(312, 148, Math.max(10, 184 * fk), 20, 10); cx.fill();
  // question
  fitText(S.L.q, W / 2, 218, 30, 480, '#fff');

  // scene card
  const intro = S.phase === 'intro' ? clamp((t - S.phaseT) / 0.5) : 1;
  cx.save(); cx.translate(sc.x + sc.s / 2, sc.y + sc.s / 2); const bs = 0.75 + 0.25 * ease.back(intro); cx.scale(bs, bs);
  cx.globalAlpha = clamp(intro * 1.6); cx.translate(-sc.s / 2, -sc.s / 2);
  cx.fillStyle = '#00000044'; rr(-8, 2, sc.s + 16, sc.s + 16, 26); cx.fill();
  cx.fillStyle = '#fff'; rr(-8, -8, sc.s + 16, sc.s + 16, 26); cx.fill();
  cx.save(); rr(0, 0, sc.s, sc.s, 18); cx.clip();
  cx.drawImage(layerTruth, 0, 0, sc.s, sc.s);
  const rv = S.phase === 'win' || S.phase === 'end' ? clamp((t - S.phaseT) / 0.5) : 0;
  if (S.phase !== 'end') { cx.globalAlpha = (1 - rv) * clamp(intro * 1.6); cx.drawImage(layerCover, 0, 0, sc.s, sc.s); cx.globalAlpha = 1; }
  if (S.L.overlay) S.L.overlay(cx, t, S.phase === 'win' ? clamp((t - S.phaseT - 0.2) / 0.9) : 0);
  if (rv > 0 && rv < 1) { cx.fillStyle = `rgba(255,255,255,${0.6 * (1 - rv)})`; cx.fillRect(0, 0, sc.s, sc.s); }
  cx.restore();
  // hint ring
  if (t - S.hint < 3 && S.phase === 'play') {
    const T = S.L.target, p = ((t - S.hint) % 1) ; cx.setLineDash([14, 10]); cx.lineDashOffset = -t * 40; cx.strokeStyle = '#ffd60a'; cx.lineWidth = 6; cx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 8);
    cx.beginPath(); if (T.kind === 'rect') cx.rect(T.x, T.y, T.w, T.h); else cx.ellipse(T.x, T.y, T.rx * (0.95 + p * 0.05), T.ry, 0, 0, Math.PI * 2); cx.stroke();
    cx.setLineDash([]); cx.globalAlpha = 1;
  }
  cx.restore();

  // footer
  if (S.phase === 'play' || S.phase === 'intro') {
    const b = UI.hint; cx.fillStyle = '#00000044'; rr(b.x - b.w / 2, b.y - b.h / 2 + 6, b.w, b.h, 29); cx.fill();
    cx.fillStyle = '#ffd60a'; rr(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, 29); cx.fill(); text('HINT', b.x, b.y + 1, 24, '#3d2c00');
    cx.fillStyle = '#ffffff22'; rr(28, 762, 300, 56, 28); cx.fill();
    text(S.tutorial ? 'Wipe to find the truth!' : `Found: ${Math.round(clamp(S.cov / CFG.winCoverage) * 100)}%`, 178, 791, 22, '#fff', 800);
  }
  if (S.phase === 'win') {
    const a = clamp((t - S.phaseT - 0.35) / 0.35);
    cx.save(); cx.globalAlpha = a; cx.translate(W / 2, 800); cx.scale(0.8 + 0.2 * ease.back(a), 0.8 + 0.2 * ease.back(a));
    cx.fillStyle = '#ffd60a'; rr(-230, -46, 460, 92, 46); cx.fill(); fitText(S.L.answer, 0, 2, 36, 420, '#3d2c00'); cx.restore();
    text(['AHA!', 'GENIUS!', 'BRILLIANT!'][S.li % 3], W / 2, 890, 34, '#fff');
  }

  // tutorial hand: generic swipe in the middle of the scene (does not give the answer away)
  if (S.tutorial && S.phase === 'play' && !DEMO && !S.stroke) {
    const p = (t * 0.8) % 1; hand(sc.x + 140 + Math.sin(p * Math.PI * 2) * 90, sc.y + 230 + Math.cos(p * Math.PI * 4) * 20, true);
  }
  if (DEMO && demo.cursor && (S.phase === 'play' || S.phase === 'intro')) hand(sc.x + demo.cursor.x + 8, sc.y + demo.cursor.y + 12, demo.cursor.press);

  // fx
  S.fx = S.fx.filter(p => t - p.t < p.life);
  for (const p of S.fx) { const a = t - p.t; cx.globalAlpha = 1 - a / p.life; cx.fillStyle = p.c;
    cx.save(); cx.translate(p.x + p.vx * a, p.y + p.vy * a + 500 * a * a); cx.rotate(a * 8 + p.r); cx.fillRect(-6, -4, 12, 8); cx.restore(); }
  cx.globalAlpha = 1;

  if (DEMO && demo.cap && S.phase !== 'end') caption(demo.cap);
  if (S.phase === 'fail' || S.phase === 'end') overlayCard();
}

function caption(cap) {
  const a = clamp((S.t - cap.t) / 0.25), parts = cap.text.split(' ');
  cx.save(); cx.translate(W / 2, 82); const s = 0.8 + 0.2 * ease.back(a); cx.scale(s, s); cx.globalAlpha = a;
  cx.font = `900 44px ${FONT}`; const plain = cap.text.replace(/\*/g, ''); const w = Math.min(500, cx.measureText(plain).width + 60);
  cx.fillStyle = '#00000055'; rr(-w / 2, -40, w, 86, 30); cx.fill(); cx.fillStyle = '#fff'; rr(-w / 2, -46, w, 86, 30); cx.fill();
  const k = Math.min(1, (w - 60) / cx.measureText(plain).width); cx.font = `900 ${44 * k}px ${FONT}`;
  let x = -cx.measureText(plain).width / 2; cx.textAlign = 'left'; cx.textBaseline = 'middle';
  for (let i = 0; i < parts.length; i++) { const hl = parts[i].startsWith('*'), wd = parts[i].replace(/\*/g, '') + (i < parts.length - 1 ? ' ' : '');
    cx.fillStyle = hl ? '#e85d04' : '#2b2d42'; cx.fillText(wd, x, -2); x += cx.measureText(wd).width; }
  cx.restore();
}

function overlayCard() {
  const t = S.t, a = clamp((t - S.phaseT) / 0.4);
  cx.fillStyle = `rgba(20,16,50,${0.7 * a})`; cx.fillRect(-300, -300, W + 600, H + 600);
  cx.save(); cx.globalAlpha = a; const y0 = 170 + (1 - ease.out(a)) * 60;
  cx.fillStyle = '#fff'; rr(40, y0, 460, 600, 36); cx.fill();
  if (S.phase === 'end') {
    text('SNEAKY WIPE', W / 2, y0 + 72, 54, '#5f4bb6'); text('Tricky Reveal', W / 2, y0 + 116, 24, '#8a78d6', 800);
    // mini "before / after" thumbnails of the three levels
    for (let i = 0; i < 3; i++) { const x = 70 + i * 140, y = y0 + 160; cx.save(); rr(x, y, 120, 120, 16); cx.clip();
      cx.drawImage(thumbs[i], x, y, 120, 120); cx.restore(); cx.strokeStyle = '#5f4bb6'; cx.lineWidth = 4; rr(x, y, 120, 120, 16); cx.stroke(); }
    text('500+ brain twisters', W / 2, y0 + 340, 34, '#2b2d42'); text('Wipe. Peek. Gasp! New riddles daily', W / 2, y0 + 382, 21, '#8a78d6', 800);
    button('PLAY FREE', W / 2, y0 + 490, UI.cta.w, UI.cta.h, '#fb8500', '#fff', t, '#a14d00');
  } else {
    text('Out of eraser!', W / 2, y0 + 80, 44, '#ef476f');
    eraserIcon(W / 2, y0 + 200, 4);
    text(`Truth found: ${Math.round(clamp(S.cov / CFG.winCoverage) * 100)}%`, W / 2, y0 + 320, 26, '#2b2d42', 800);
    text('Tip: look for clues before you wipe', W / 2, y0 + 360, 20, '#8a78d6', 800);
    button('TRY AGAIN', W / 2, y0 + 440, UI.retry.w, UI.retry.h, '#8ecae6', '#073b4c', t);
    button('GET FULL GAME', W / 2, y0 + 535, UI.cta.w, 76, '#fb8500', '#fff', t, '#a14d00');
  }
  cx.restore();
}

// thumbnails of solved levels for the end card
const thumbs = LEVELS.map(L => { const c = document.createElement('canvas'); c.width = c.height = 240; const g = c.getContext('2d'); g.scale(240 / 460, 240 / 460);
  L.base(g); L.truth(g); if (L.overlay) { const real = L.overlay; real(g, 0, 1); } return c; });

/* ---------- update ---------- */
function update() {
  if (S.phase === 'intro' && S.t - S.phaseT > 0.55) S.phase = 'play';
  if (S.phase === 'win' && S.t - S.phaseT > 2.0) { if (S.li + 1 < LEVELS.length) loadLevel(S.li + 1); else { S.phase = 'end'; S.phaseT = S.t; log('end'); } }
  if (DEMO) demo.step();
}

/* ---------- input ---------- */
function toLogical(e) { return [(e.clientX * devicePixelRatio - offX) / scale, (e.clientY * devicePixelRatio - offY) / scale]; }
function toScene(x, y) { return [x - CFG.scene.x, y - CFG.scene.y]; }
function cta() { log('cta'); try { if (window.mraid && mraid.open) { mraid.open(CFG.storeUrl); return; } } catch (e) {} window.open(CFG.storeUrl, '_blank'); }
function useHint() { if (S.phase !== 'play') return; S.hint = S.t; sfx.click(); log('hint'); }
function cardY() { return 170; }
cv.addEventListener('pointerdown', e => {
  audio(); if (DEMO) return;
  const [x, y] = toLogical(e);
  if (S.phase === 'end') { cta(); return; }
  if (S.phase === 'fail') { const yy = cardY() + 440; if (Math.abs(x - W / 2) < UI.retry.w / 2 && Math.abs(y - yy) < UI.retry.h / 2) { sfx.click(); loadLevel(S.li); } else if (y > yy + 50) cta(); return; }
  const b = UI.hint; if (Math.abs(x - b.x) < b.w / 2 && Math.abs(y - b.y) < b.h / 2) { useHint(); return; }
  const [sx, sy] = toScene(x, y);
  if (sx >= 0 && sy >= 0 && sx <= CFG.scene.s && sy <= CFG.scene.s && S.phase === 'play') {
    S.stroke = { x: sx, y: sy, moved: false }; log('wipe_start'); wipe(sx, sy, sx, sy); cv.setPointerCapture(e.pointerId);
  }
});
cv.addEventListener('pointermove', e => { if (!S.stroke || DEMO) return; const [sx, sy] = toScene(...toLogical(e)); wipe(S.stroke.x, S.stroke.y, sx, sy); if (S.stroke) { S.stroke.x = sx; S.stroke.y = sy; } });
const endStroke = () => { if (S.stroke) { log('wipe_end'); if (S.stroke.moved) S.tutorial = false; S.stroke = null; } };
cv.addEventListener('pointerup', endStroke); cv.addEventListener('pointercancel', endStroke);

/* ---------- demo script (autoplay + captions for the 23 s ad) ---------- */
function zig(x0, y0, x1, y1, rows) { const p = []; for (let i = 0; i <= rows; i++) { const y = y0 + (y1 - y0) * i / rows; p.push(i % 2 ? [x1, y] : [x0, y]); if (i < rows) p.push(i % 2 ? [x1, y + (y1 - y0) / rows / 2] : [x0, y + (y1 - y0) / rows / 2]); } return p; }
const PLAN = [
  [ { wait: 0.35, cap: 'Only *geniuses* get this!' }, { stroke: zig(40, 236, 140, 340, 3), dur: 2.0, cap: 'The *dog?*' }, { wait: 0.6, cap: 'Nope... look *closer!*' },
    { stroke: zig(330, 64, 444, 345, 6), dur: 3.0 } ],
  [ { wait: 0.8, cap: 'Why so *sad?*' }, { stroke: zig(255, 30, 445, 165, 4), dur: 2.6, cap: 'What is *behind* the cloud?' } ],
  [ { wait: 0.3, cap: 'Level 3: *99%* fail' }, { stroke: zig(362, 300, 446, 372, 3), dur: 1.8, cap: 'Eraser running *out!*' }, { wait: 0.6, cap: 'WAIT... the *cat!*' },
    { stroke: zig(115, 230, 345, 370, 5), dur: 2.6 } ],
];
const demo = {
  cursor: null, cap: null, q: null, i: 0, t0: 0, lvl: -1, last: null,
  setCap(text) { if (text && (!this.cap || this.cap.text !== text)) this.cap = { text, t: S.t }; },
  step() {
    if (S.phase === 'end') { this.cap = null; return; }
    if (S.li !== this.lvl) { this.lvl = S.li; this.q = PLAN[S.li]; this.i = 0; this.t0 = null; }
    if (S.phase !== 'play') { if (this.cursor) this.cursor.press = false; return; }
    const a = this.q[this.i]; if (!a) return;
    if (this.t0 === null) { this.t0 = S.t; this.setCap(a.cap); if (a.stroke) { log('wipe_start'); this.last = null; } }
    if (a.wait !== undefined) { if (!this.cursor) this.cursor = { x: 380, y: 420, press: false }; this.cursor.press = false;
      if (S.t - this.t0 >= a.wait) { this.i++; this.t0 = null; } return; }
    const k = clamp((S.t - this.t0) / a.dur), P = a.stroke, f = k * (P.length - 1), j = Math.min(P.length - 2, Math.floor(f)), u = f - j;
    const x = P[j][0] + (P[j + 1][0] - P[j][0]) * u, y = P[j][1] + (P[j + 1][1] - P[j][1]) * u;
    if (this.last) wipe(this.last[0], this.last[1], x, y); else wipe(x, y, x, y);
    this.last = [x, y]; this.cursor = { x, y, press: true };
    if (k >= 1 || S.phase !== 'play') { log('wipe_end'); this.i++; this.t0 = null; this.cursor.press = false; }
  },
};

/* ---------- loop ---------- */
function resize() {
  const dpr = devicePixelRatio || 1; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  scale = Math.min(cv.width / W, cv.height / H); offX = (cv.width - W * scale) / 2; offY = (cv.height - H * scale) / 2;
}
addEventListener('resize', resize); resize();
loadLevel(0);
let last = performance.now();
function frame(now) { S.t += Math.min(0.05, (now - last) / 1000); last = now; update(); render(); requestAnimationFrame(frame); }
if (CAP) { window.__advance = dt => { S.t += dt; update(); render(); }; render(); } else requestAnimationFrame(frame);

window.__game = { state: S, level: i => loadLevel(i - 1),
  wipeTarget: () => { const T = S.L.target; const x0 = T.kind === 'rect' ? T.x : T.x - T.rx, x1 = T.kind === 'rect' ? T.x + T.w : T.x + T.rx,
    y0 = T.kind === 'rect' ? T.y : T.y - T.ry, y1 = T.kind === 'rect' ? T.y + T.h : T.y + T.ry;
    for (let y = y0; y <= y1 && S.phase === 'play'; y += 40) wipe(x0, y, x1, y); } };
})();
</script>
